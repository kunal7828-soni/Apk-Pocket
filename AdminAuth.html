<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - APKPocket</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
}

.login-box{
    width:400px;
    max-width:90%;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:800;
    margin-bottom:10px;
}

.logo span{
    color:#2563eb;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    transition:.3s;
}

.input-group input:focus{
    border-color:#2563eb;
}

.login-btn{
    width:100%;
    border:none;
    padding:14px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:700;
    border-radius:10px;
    cursor:pointer;
}

.login-btn:hover{
    background:#1d4ed8;
}

.error{
    color:red;
    text-align:center;
    margin-top:12px;
    display:none;
}
</style>
</head>

<body>

<div class="login-box">
    <div class="logo">APK<span>Pocket</span></div>
    <p class="subtitle">Admin Authentication</p>

    <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter Admin Email">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password">
    </div>

    <button class="login-btn" onclick="login()">
        Login
    </button>

    <p id="error" class="error">
        Invalid Email or Password
    </p>
</div>

<script>
function login() {

    const adminEmail = "admin@apkpocket.com";
    const adminPassword = "Kunal@123";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(email === adminEmail && password === adminPassword){

        localStorage.setItem("adminLoggedIn","true");

        window.location.href = "Admin.html";

    } else {

        document.getElementById("error").style.display = "block";

    }
}
</script>

</body>
</html>
