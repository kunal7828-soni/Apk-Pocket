<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - APKPocket</title>

 <link rel="stylesheet" href="adminAuth.css" />
</head>

<body>

<div class="login-box">
    <div class="logo">APK<span>Pocket</span></div>
    <p class="subtitle">Admin Authentication</p>

    <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter Admin Email">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password">
    </div>

    <button class="login-btn" onclick="login()">
        Login
    </button>

    <p id="error" class="error">
        Invalid Email or Password
    </p>
</div>

<script src="adminAuth.js">

</script>
<script>
    document.addEventListener("contextmenu", function (event) {
    event.preventDefault();
});
  </script>
</body>
</html>
